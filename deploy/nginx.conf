# nginx site for the portfolio. deploy.sh replaces __DOMAIN__ and installs this
# as /etc/nginx/sites-available/nayara-portfolio; certbot then adds HTTPS to it.

map $sent_http_content_type $nayara_expires {
    default                 off;
    text/html               epoch;
    application/javascript  1h;
    ~image/                 30d;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/nayara-portfolio/current;
    index index.html;

    expires $nayara_expires;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Only the site's own files are served; nothing else in the folder.
    location ~ /\. { deny all; }
}
